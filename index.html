<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard layout demo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>

    <header>
        <div class="menu-icon">
            <i class="fas fa-bars"></i>
            <img id="logo" src="logo-isi-light-CMberm3w.png" style="max-height: 24px;">
        </div>
        <div class="user-profile">
            <div class="user-details">
                <div class="name">Carlos</div>
                <div id="role" class="role">Administrador</div>
            </div>
            <div class="avatar">C</div>
        </div>
    </header>

    <div class="layout-container">
        
        <aside>
            <i class="sidebar-icon active fas fa-th-large"></i>
            <i class="sidebar-icon fas fa-user-friends"></i>
            <i class="sidebar-icon fas fa-shield-alt"></i>
            <i class="sidebar-icon fas fa-building"></i>
            <i class="sidebar-icon fas fa-tasks"></i>
            <i class="sidebar-icon fas fa-calendar-alt"></i>
            <i class="sidebar-icon fas fa-file-alt"></i>
            <i class="sidebar-icon fas fa-exclamation-triangle"></i>
            <i class="sidebar-icon fas fa-cog"></i>
        </aside>

        <main>
            <div class="view-toggles">
                <button class="toggle-btn active" onclick="switchView('admin')" id="btn-admin">
                    <i class="fas fa-eye"></i> Admin
                </button>
                <button class="toggle-btn" onclick="switchView('client')" id="btn-client">
                    <i class="fas fa-eye"></i> Cliente
                </button>
            </div>

            <div class="view-content active" id="view-admin">
                
                <div id="d3-admin-container" style="margin-top:20px;"></div>
            </div>

            <div class="view-content" id="view-client">
        
                <div id="d3-client-container" style="margin-top:20px;"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
